<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="토계부" />
<meta name="theme-color" content="#11151b" />
<meta name="robots" content="noindex, nofollow" />
<title>토계부</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root {
  --ink:#11151b; --panel:#171d25; --panel-2:#1d242e; --line:#29323d; --line-2:#364251;
  --text:#e6eaef; --dim:#8d98a7; --dimmer:#5f6b7a;
  --up:#3fbf7f; --down:#e0605f; --wait:#d6a44c; --key:#6478ff;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink:#f4f5f7; --panel:#ffffff; --panel-2:#eef0f3; --line:#e0e3e8; --line-2:#ccd1d9;
  --text:#1a1f27; --dim:#69737f; --dimmer:#98a2b0;
  --up:#1f9d5c; --down:#d1453b; --wait:#b8842e; --key:#4a5fe0;
  color-scheme: light;
}
html { background: var(--ink); }
body { transition: background .15s, color .15s; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; }
body {
  font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic', sans-serif;
  background: var(--ink); color: var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing: antialiased; min-height:100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.num { font-variant-numeric: tabular-nums; letter-spacing:-.01em; }
.wrap { max-width:1180px; margin:0 auto; padding:0 20px 72px; }
.hidden { display:none !important; }

button { font:inherit; cursor:pointer; border-radius:7px; transition:background .12s, border-color .12s, color .12s; }
button:focus-visible { outline:2px solid var(--key); outline-offset:2px; }
button:disabled { opacity:.5; cursor:default; }
.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 11px; font-size:12.5px; }
.ghost:hover { border-color:var(--line-2); color:var(--text); }
.ghost.danger:hover { border-color:var(--down); color:var(--down); }

/* 로그인 */
.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.gate-box { width:100%; max-width:340px; }
.gate h1 { font-size:22px; letter-spacing:-.03em; margin:0 0 4px; }
.gate p.lead { color:var(--dimmer); font-size:13px; margin:0 0 26px; }
.gate label { display:block; font-size:12px; color:var(--dim); margin:0 0 6px; }
.gate input { width:100%; margin-bottom:13px; }
.gate .row { display:flex; gap:8px; margin-top:4px; }
.gate .row button { flex:1; padding:11px 0; font-size:14px; font-weight:600; border:0; }
#do-login { background:var(--key); color:#fff; }
#do-login:hover { background:#7386ff; }
#do-signup { background:transparent; border:1px solid var(--line); color:var(--dim); }
#do-signup:hover { border-color:var(--line-2); color:var(--text); }
.gate .msg { font-size:12.5px; margin-top:14px; min-height:18px; color:var(--wait); }

/* 설정 안내 */
.setup { max-width:560px; margin:80px auto; padding:24px; border:1px solid #4a3a24; background:#241d12;
         color:#e5c185; border-radius:12px; font-size:13.5px; line-height:1.8; }
.setup code { background:rgba(0,0,0,.3); padding:2px 6px; border-radius:4px; }
:root[data-theme="light"] .setup { border-color:#e8d3a3; background:#fbf1dc; color:#8a6414; }
:root[data-theme="light"] .setup code { background:rgba(0,0,0,.06); }

/* 헤더 */
.top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; padding:20px 0 24px; }
.brand { display:flex; align-items:baseline; gap:10px; min-width:0; }
.brand b { font-size:19px; font-weight:700; letter-spacing:-.03em; white-space:nowrap; }
.brand span { font-size:12px; color:var(--dimmer); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tools .sep { width:1px; height:18px; background:var(--line); margin:0 2px; }

/* 기간 */
.range { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:18px; }
.seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; }
.seg button { border:0; background:transparent; color:var(--dim); padding:6px 14px; font-size:13px; border-radius:6px; font-weight:500; }
.seg button.on { background:var(--panel-2); color:var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
input[type=date], input[type=text], input[type=email], input[type=password] {
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:9px 11px; font:inherit; font-size:15px;
}
input:focus { outline:none; border-color:var(--key); }

/* 히어로 */
.hero { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:28px; align-items:center;
        background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px 26px; margin-bottom:22px; }
.total { font-size:44px; font-weight:700; letter-spacing:-.045em; line-height:1.05; }
.total small { font-size:20px; font-weight:600; margin-left:3px; }
.total-label { font-size:12.5px; color:var(--dimmer); margin-bottom:6px; }
.meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:13px; color:var(--dim); }
.meta b { color:var(--text); font-weight:600; }
.chart { height:132px; min-width:0; }
.chart-inner { position:relative; }
.chart svg { display:block; width:100%; height:112px; touch-action:pan-y; cursor:crosshair; }
.chart-tip { position:absolute; transform:translate(-50%,-100%); background:var(--panel-2); border:1px solid var(--line-2);
             border-radius:7px; padding:5px 9px; font-size:11.5px; white-space:nowrap; pointer-events:none;
             display:flex; flex-direction:column; align-items:center; gap:1px; box-shadow:0 4px 10px rgba(0,0,0,.25); }
.chart-tip b { font-size:12.5px; }
.chart-tip span { color:var(--dimmer); font-size:10.5px; }
.chart .xlab { display:flex; justify-content:space-between; font-size:11px; color:var(--dimmer); margin-top:4px; }
.chart .blank { height:132px; display:flex; align-items:center; justify-content:center; color:var(--dimmer);
                font-size:13px; border:1px dashed var(--line); border-radius:10px; text-align:center; padding:0 12px; }

/* 그리드 */
.grid { display:grid; grid-template-columns:352px 1fr; gap:22px; align-items:start; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.card + .card { margin-top:22px; }
.card-h { display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); }
.card-h h2 { margin:0; font-size:14px; font-weight:600; letter-spacing:-.02em; }
.card-h em { font-style:normal; font-size:12px; color:var(--dimmer); }
.card-b { padding:16px 18px; }
.list-tools { display:flex; align-items:center; gap:8px; }
.mini-input { background:var(--panel-2); border:1px solid var(--line); color:var(--text);
              border-radius:7px; padding:5px 9px; font:inherit; font-size:12.5px; }
.mini-input::placeholder { color:var(--dimmer); }
select.mini-input { cursor:pointer; }
@media (max-width:620px) {
  .list-tools { flex-wrap:wrap; justify-content:flex-end; gap:6px; }
  #search { width:96px; }
}

/* 폼 */
.f { display:block; margin-bottom:13px; }
.f > span { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
.fin { width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
       border-radius:8px; padding:10px 11px; font:inherit; font-size:15px; }
.fin:focus { outline:none; border-color:var(--key); }
.fin::placeholder { color:var(--dimmer); }
textarea.fin { resize:none; overflow:hidden; display:block; line-height:1.45; max-height:220px; overflow-y:auto; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { border:1px solid var(--line); background:transparent; color:var(--dim); padding:6px 11px; font-size:12.5px; border-radius:20px; }
.chip-add { border-style:dashed; color:var(--dimmer); }
.chip-toggle { color:var(--key); border-color:var(--key); }
.filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:18px; }
.filterbar-label { font-size:12px; color:var(--dimmer); white-space:nowrap; }
.chips-sm .chip { padding:4px 9px; font-size:11.5px; }
.quick { display:flex; gap:5px; margin-top:7px; }
.quick button { flex:1; border:1px solid var(--line); background:transparent; color:var(--dim); font-size:12px; padding:7px 0; }
.calc { font-size:12px; color:var(--dimmer); margin-top:6px; min-height:17px; }
.status { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.status button { border:1px solid var(--line); background:transparent; color:var(--dim); padding:9px 0; font-size:13px; font-weight:500; }
.submit { width:100%; border:0; background:var(--key); color:#fff; padding:12px 0; font-size:14px; font-weight:600; margin-top:4px; }
.cancel { width:100%; border:0; background:transparent; color:var(--dim); padding:8px 0; font-size:12.5px; margin-top:4px; }

/* 종목별 */
.cat { padding:11px 18px; border-bottom:1px solid var(--line); }
.cat:last-child { border-bottom:0; }
.cat-r { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.cat-n { font-size:13.5px; font-weight:600; }
.cat-s { font-size:12px; color:var(--dimmer); margin-top:3px; }
.bar { height:3px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:2px; }

/* 목록 */
.day { padding:9px 18px; background:var(--panel-2); border-bottom:1px solid var(--line); border-top:1px solid var(--line);
       display:flex; justify-content:space-between; font-size:12.5px; }
.day span.d { color:var(--dim); }
.row-item { border-bottom:1px solid var(--line); }
.row-item:last-child { border-bottom:0; }
.row-item.has-tags { cursor:pointer; }
.row { display:grid; grid-template-columns:68px 1fr 92px 92px 104px 62px; align-items:center; gap:10px;
       padding:11px 18px; font-size:13.5px; }
.row > span:first-child { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
.row-tags { display:flex; flex-wrap:wrap; gap:4px; padding:0 18px 11px 96px; }
.tag { display:inline-block; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:5px; white-space:nowrap; }
.tag.sub-tag { font-weight:500; opacity:.8; }
.tag-more { display:inline-block; font-size:11px; font-weight:600; padding:2px 6px; border-radius:5px;
            color:var(--dimmer); border:1px solid var(--line); }
.memo { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.memo i { font-style:normal; color:var(--dimmer); font-size:12px; margin-left:7px; }
.r { text-align:right; }
.sub { color:var(--dim); }
.act { display:flex; gap:4px; justify-content:flex-end; }
.icon { border:0; background:transparent; color:var(--dimmer); padding:5px; line-height:0; border-radius:5px; }
.icon:hover { color:var(--text); background:var(--panel-2); }
.settle { display:flex; gap:5px; justify-content:flex-end; }
.settle button { border:1px solid var(--line); background:transparent; padding:5px 10px; font-size:12px; white-space:nowrap; }
.settle button.hit { color:var(--up); }
.settle button.miss { color:var(--down); }
.blank { padding:56px 20px; text-align:center; color:var(--dimmer); font-size:13.5px; line-height:1.9; }
.blank code { background:var(--panel-2); padding:2px 6px; border-radius:4px; color:var(--dim); }

/* 수정 팝업 */
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90;
                   opacity:0; pointer-events:none; transition:opacity .15s; }
.modal-backdrop.show { opacity:1; pointer-events:auto; }
.card.as-modal {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:100; width:min(420px, calc(100vw - 32px)); max-height:calc(100vh - 48px);
  overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); margin:0;
}

/* 토스트 */
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(22px + env(safe-area-inset-bottom));
         background:var(--panel-2); border:1px solid var(--line-2); color:var(--text);
         padding:10px 16px; border-radius:9px; font-size:13px; z-index:50; opacity:0; pointer-events:none;
         transition:opacity .18s; max-width:88vw; text-align:center; }
.toast.on { opacity:1; }

@media (hover: hover) {
  .act { opacity:0; }
  .row-item:hover .row { background:rgba(255,255,255,.018); }
  .row-item:hover .act, .row-item:focus-within .act { opacity:1; }
  .chip:hover { border-color:var(--line-2); }
  .quick button:hover { color:var(--text); border-color:var(--line-2); }
  .settle button:hover { border-color:currentColor; }
}
@media (max-width: 980px) {
  .grid { grid-template-columns:1fr; }
  .hero { grid-template-columns:1fr; gap:16px; padding:20px; }
}
@media (max-width: 620px) {
  .wrap { padding:0 12px 60px; }
  .top { flex-direction:column; align-items:flex-start; padding-right:44px; }
  .tools { width:100%; }
  .row { grid-template-columns:56px 1fr 112px; gap:8px; padding:12px 14px; }
  .row-tags { padding-left:14px; }
  .settle { gap:4px; }
  .settle button { padding:5px 4px; font-size:11px; }
  .hide-sm { display:none; }
  .total { font-size:36px; }
  .card-b { padding:14px; }
  .day { padding:9px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

.theme-toggle {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
  z-index:60; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;
  font-size:16px; background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:9px;
}
.theme-toggle:hover { border-color:var(--line-2); color:var(--text); }
</style>
</head>
<body>

<button class="theme-toggle" id="btn-theme" title="테마 전환" aria-label="테마 전환">🌙</button>

<!-- 설정 안 된 경우 -->
<div class="setup hidden" id="setup">
  <b>설정이 아직 안 끝났습니다.</b><br>
  이 파일을 텍스트 편집기로 열어 맨 아래 <code>SUPABASE_URL</code>과 <code>SUPABASE_ANON_KEY</code>에
  Supabase 프로젝트 값을 넣어 주세요. 대화에 적어둔 설정 순서를 참고하시면 됩니다.
</div>

<!-- 로그인 -->
<div class="gate hidden" id="gate">
  <div class="gate-box">
    <h1>토계부</h1>
    <p class="lead">기록은 계정에 저장되고 기기마다 같이 보입니다.</p>
    <label for="email">이메일</label>
    <input type="email" id="email" autocomplete="username" inputmode="email" />
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" />
    <div class="row">
      <button id="do-login">로그인</button>
      <button id="do-signup">가입</button>
    </div>
    <div class="msg" id="gate-msg"></div>
  </div>
</div>

<!-- 본체 -->
<div class="wrap hidden" id="app">
  <header class="top">
    <div class="brand"><b>토계부</b><span id="count"></span></div>
    <div class="tools">
      <button class="ghost" id="btn-csv">CSV</button>
      <button class="ghost" id="btn-export">백업</button>
      <button class="ghost" id="btn-import">복원</button>
      <span class="sep"></span>
      <button class="ghost danger" id="btn-wipe">초기화</button>
      <button class="ghost" id="btn-logout">로그아웃</button>
      <input type="file" id="file" accept="application/json" style="display:none" />
    </div>
  </header>

  <div class="range">
    <div class="seg" id="seg">
      <button data-p="all">전체</button>
      <button data-p="today">오늘</button>
      <button data-p="month" class="on">이번 달</button>
      <button data-p="last">지난달</button>
    </div>
    <input type="date" id="from" />
    <span style="color:var(--dimmer)">–</span>
    <input type="date" id="to" />
  </div>

  <div class="filterbar" id="tagfilter-wrap">
    <span class="filterbar-label">태그 필터</span>
    <div class="chips chips-sm" id="tagfilter"></div>
  </div>

  <section class="hero">
    <div>
      <div class="total-label">기간 수익</div>
      <div class="total num" id="total">0<small>원</small></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <div class="grid">
    <div>
      <div class="card" id="form-card">
        <div class="card-h"><h2 id="form-title">빠른 입력</h2><em id="form-hint">Enter로 저장</em></div>
        <div class="card-b" id="form">
          <label class="f"><span>일자</span><input class="fin" type="date" id="f-date" /></label>
          <div class="f"><span>종목</span><div class="chips" id="chips"></div></div>
          <div class="f"><span>태그 <em style="font-style:normal;color:var(--dimmer)">(선택, 여러 개 가능)</em></span><div class="chips" id="tagchips"></div></div>
          <label class="f"><span>메모</span>
            <textarea class="fin" id="f-memo" rows="1" placeholder="배팅 내역" autocomplete="off"></textarea>
          </label>
          <div class="two">
            <label class="f"><span>배팅금액</span>
              <input class="fin num" type="text" id="f-stake" inputmode="numeric" placeholder="0" autocomplete="off" />
            </label>
            <label class="f"><span>배당</span>
              <input class="fin num" type="text" id="f-odds" inputmode="decimal" placeholder="1.85" autocomplete="off" />
            </label>
          </div>
          <div class="quick" id="quick">
            <button data-add="10000">+1만</button>
            <button data-add="50000">+5만</button>
            <button data-add="100000">+10만</button>
            <button data-add="clear">지우기</button>
          </div>
          <label class="f" style="margin-top:13px"><span>당첨금액</span>
            <input class="fin num" type="text" id="f-payout" inputmode="numeric" placeholder="배당을 넣으면 자동 계산" autocomplete="off" />
            <div class="calc" id="calc"></div>
          </label>
          <div class="f"><span>결과</span>
            <div class="status" id="status">
              <button data-s="hit">적중</button>
              <button data-s="miss">미적중</button>
              <button data-s="pending" class="on">대기</button>
            </div>
          </div>
          <button class="submit" id="save">기록 추가</button>
          <button class="cancel hidden" id="cancel">수정 취소</button>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h2>종목별</h2><em>기간 내</em></div>
        <div id="cats"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <h2>기록</h2>
        <div class="list-tools">
          <input type="text" class="mini-input" id="search" placeholder="메모/종목 검색" />
          <select class="mini-input" id="sortby">
            <option value="date-desc">최신순</option>
            <option value="date-asc">오래된순</option>
            <option value="stake-desc">배팅금액순</option>
            <option value="profit-desc">수익순</option>
          </select>
          <em class="num" id="listcount">0건</em>
        </div>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="modal-backdrop"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ================================================================
   1. 여기 두 줄만 본인 Supabase 값으로 바꾸면 됩니다.
   Supabase 대시보드 → Project Settings → API 에서 복사하세요.
   anon key는 공개되어도 되는 값입니다. (RLS로 본인 데이터만 열립니다)
   ================================================================ */
const SUPABASE_URL      = 'https://tiyhjrvfwtwdbsfaunmz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_zfZgnjSTH42HahrRM_aJOg_qYOCFEod';
/* ================================================================ */

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const $ = id => document.getElementById(id);

/* ---------------- 테마 ---------------- */
const THEME_KEY = 'tokyebu-theme';
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('btn-theme').textContent = t === 'light' ? '☀️' : '🌙';
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f4f5f7' : '#11151b');
}
applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');
$('btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

if (SUPABASE_URL.includes('여기에') || SUPABASE_ANON_KEY.includes('여기에')) {
  $('setup').classList.remove('hidden');
  throw new Error('setup required');
}

const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- 유틸 ---------------- */
const BASE_CATS = ['LOL','농구','배구','UFC','기타'];
const CAT_COLOR = { LOL:'#8f7ced', 축구:'#4fb58a', 야구:'#5aa9e0', 농구:'#e0a74f', 배구:'#d96a8e',
                    UFC:'#e0805a', MLB:'#5aa9e0', NBA:'#e0a74f', KBO:'#5aa9e0', 기타:'#8d98a7' };
const AUTO_PALETTE = ['#c48fe0','#5ec9c2','#c9c24f','#7d98e0','#e0637d','#6fcf7d','#e0975a',
                       '#5ab0b5','#a37de0','#e0b45a','#7ee0c4','#e08f6f','#8fb0e0','#e0a3c4','#9fe05a','#e0d15a'];
function catColor(c){
  if (CAT_COLOR[c]) return CAT_COLOR[c];
  let h = 0;
  for (let i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) >>> 0;
  return AUTO_PALETTE[h % AUTO_PALETTE.length];
}
const tint = (hex,a) => { const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };
const iso = d => d.toLocaleDateString('sv-SE');
const today = () => iso(new Date());
const won = n => Number(n||0).toLocaleString('ko-KR');
const signed = n => (n>0?'+':n<0?'−':'') + won(Math.abs(n));
const pnl = n => n>0?'var(--up)':n<0?'var(--down)':'var(--dim)';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const profitOf = b => b.status==='hit' ? (b.payout||0)-b.stake : b.status==='miss' ? -b.stake : 0;
function monthRange(off){ const n=new Date();
  return [iso(new Date(n.getFullYear(), n.getMonth()+off, 1)), iso(new Date(n.getFullYear(), n.getMonth()+off+1, 0))]; }

let toastTimer;
function toast(msg){
  $('toast').textContent = msg; $('toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 2400);
}

/* ---------------- 상태 ---------------- */
let bets = [];
let from = monthRange(0)[0], to = monthRange(0)[1];
let cat = 'LOL', tags = [], tagFilter = [], status = 'pending', editId = null, busy = false;
let search = '', sortBy = 'date-desc';

/* ---------------- 로그인 ---------------- */
$('do-login').addEventListener('click', () => auth('in'));
$('do-signup').addEventListener('click', () => auth('up'));
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') auth('in'); });

async function auth(mode){
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || !password) { $('gate-msg').textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }
  $('gate-msg').textContent = '처리 중…';
  const { data, error } = mode === 'in'
    ? await supa.auth.signInWithPassword({ email, password })
    : await supa.auth.signUp({ email, password });
  if (error) { $('gate-msg').textContent = error.message; return; }
  if (mode === 'up' && !data.session) {
    $('gate-msg').textContent = '가입되었습니다. 메일함의 확인 링크를 누른 뒤 로그인하세요.';
    return;
  }
  $('gate-msg').textContent = '';
  start();
}

$('btn-logout').addEventListener('click', async () => {
  await supa.auth.signOut();
  bets = []; location.reload();
});

$('btn-wipe').addEventListener('click', async () => {
  if (busy) return;
  if (!bets.length) { toast('삭제할 기록이 없습니다.'); return; }
  const typed = prompt(`전체 ${bets.length}건의 기록을 모두 삭제합니다. 되돌릴 수 없습니다.\n계속하려면 "삭제"를 입력하세요.`);
  if (typed !== '삭제') return;
  busy = true; $('btn-wipe').disabled = true;
  const { error } = await supa.from('bets').delete().not('id', 'is', null);
  busy = false; $('btn-wipe').disabled = false;
  if (error) { toast('삭제 실패: ' + error.message); return; }
  toast('모든 기록을 삭제했습니다.');
  await reload();
});

/* ---------------- 시작 ---------------- */
(async function boot(){
  const { data } = await supa.auth.getSession();
  if (data.session) start(); else $('gate').classList.remove('hidden');
})();

async function start(){
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  const { data: { user } } = await supa.auth.getUser();
  $('count').textContent = user?.email || '';
  $('from').value = from; $('to').value = to; $('f-date').value = today();
  resetForm();
  await reload();
  $('f-memo').focus();
}

async function reload(){
  const scrollY = window.scrollY;
  const PAGE = 1000;
  let all = [], from = 0;
  while (true) {
    const { data, error } = await supa.from('bets').select('*')
      .order('date', { ascending:false }).order('created_at', { ascending:false }).order('id', { ascending:false })
      .range(from, from + PAGE - 1);
    if (error) { toast('불러오기 실패: ' + error.message); return; }
    all = all.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  bets = all;
  render();
  window.scrollTo(0, scrollY);
}

/* ---------------- 기간 ---------------- */
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('seg').children].forEach(x => x.classList.toggle('on', x === b));
  const p = b.dataset.p;
  if (p==='today') { from = to = today(); }
  else if (p==='month') { [from,to] = monthRange(0); }
  else if (p==='last') { [from,to] = monthRange(-1); }
  else { from = ''; to = ''; }
  $('from').value = from; $('to').value = to;
  render();
});
$('from').addEventListener('change', e => { from = e.target.value; clearSeg(); render(); });
$('to').addEventListener('change', e => { to = e.target.value; clearSeg(); render(); });
const clearSeg = () => [...$('seg').children].forEach(x => x.classList.remove('on'));

/* ---------------- 폼 ---------------- */
function catList(){
  return [...new Set([...BASE_CATS, ...bets.map(b=>b.cat), cat, ...tags])].filter(Boolean);
}
function usageFreq(){
  const freq = {};
  bets.forEach(b => {
    if (b.cat) freq[b.cat] = (freq[b.cat]||0) + 1;
    (b.tags||[]).forEach(t => freq[t] = (freq[t]||0) + 1);
  });
  return freq;
}
function rankByUsage(list){
  const freq = usageFreq();
  return [...list].sort((a,b) => (freq[b]||0) - (freq[a]||0));
}
const CHIP_TOP_N = 8;
const ADD_CHIP = '<button class="chip chip-add" data-c="__new__">+ 추가</button>';
function askNewName(label){
  const name = prompt(`추가할 ${label} 이름을 입력하세요 (최대 8자)`);
  if (!name) return null;
  return name.trim().slice(0, 8) || null;
}
function chipBtn(c, active){
  const st = active ? `style="color:${catColor(c)};border-color:${catColor(c)};background:${tint(catColor(c),.12)}"` : '';
  return `<button class="chip" data-c="${esc(c)}" ${st}>${esc(c)}</button>`;
}
let chipsExpanded = false, tagChipsExpanded = false;
function drawChips(){
  const ranked = rankByUsage(catList());
  const top = ranked.slice(0, CHIP_TOP_N);
  const shown = chipsExpanded ? ranked : [...new Set([cat, ...top])];
  const hidden = ranked.length - shown.length;
  const toggle = ranked.length > CHIP_TOP_N
    ? `<button class="chip chip-toggle" data-toggle="1">${chipsExpanded ? '접기 ▲' : `더보기 +${Math.max(hidden,0)} ▾`}</button>` : '';
  $('chips').innerHTML = shown.map(c => chipBtn(c, c === cat)).join('') + toggle + ADD_CHIP;
  drawTagChips();
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.toggle) { chipsExpanded = !chipsExpanded; drawChips(); return; }
  if (b.dataset.c === '__new__') {
    const name = askNewName('종목');
    if (name) { cat = name; drawChips(); }
    return;
  }
  cat = b.dataset.c; drawChips();
});

function drawTagChips(){
  const ranked = rankByUsage(catList());
  const top = ranked.slice(0, CHIP_TOP_N);
  const shown = tagChipsExpanded ? ranked : [...new Set([...tags, ...top])];
  const hidden = ranked.length - shown.length;
  const toggle = ranked.length > CHIP_TOP_N
    ? `<button class="chip chip-toggle" data-toggle="1">${tagChipsExpanded ? '접기 ▲' : `더보기 +${Math.max(hidden,0)} ▾`}</button>` : '';
  $('tagchips').innerHTML = shown.map(c => chipBtn(c, tags.includes(c))).join('') + toggle + ADD_CHIP;
}
function periodTagList(){
  const set = new Set();
  bets.filter(b => (!from || b.date >= from) && (!to || b.date <= to))
    .forEach(b => { if (b.cat) set.add(b.cat); (b.tags||[]).forEach(t => set.add(t)); });
  tagFilter.forEach(t => set.add(t));
  return [...set].sort();
}
function drawTagFilter(){
  const list = periodTagList();
  if (!list.length) { $('tagfilter-wrap').classList.add('hidden'); return; }
  $('tagfilter-wrap').classList.remove('hidden');
  $('tagfilter').innerHTML = list.map(c => {
    const on = tagFilter.includes(c);
    const st = on ? `style="color:${catColor(c)};border-color:${catColor(c)};background:${tint(catColor(c),.12)}"` : '';
    return `<button class="chip" data-c="${esc(c)}" ${st}>${esc(c)}</button>`;
  }).join('');
}
$('tagfilter').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const c = b.dataset.c;
  tagFilter = tagFilter.includes(c) ? tagFilter.filter(t => t !== c) : [...tagFilter, c];
  render();
});

$('search').addEventListener('input', e => { search = e.target.value.trim(); render(); });
$('sortby').addEventListener('change', e => { sortBy = e.target.value; render(); });

$('tagchips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.toggle) { tagChipsExpanded = !tagChipsExpanded; drawTagChips(); return; }
  if (b.dataset.c === '__new__') {
    const name = askNewName('태그');
    if (name && !tags.includes(name)) { tags = [...tags, name]; drawTagChips(); }
    return;
  }
  const c = b.dataset.c;
  tags = tags.includes(c) ? tags.filter(t => t !== c) : [...tags, c];
  drawTagChips();
});

const SCOLOR = { hit:'var(--up)', miss:'var(--down)', pending:'var(--wait)' };
function drawStatus(){
  [...$('status').children].forEach(b => {
    const on = b.dataset.s === status;
    b.style.color = on ? SCOLOR[b.dataset.s] : '';
    b.style.borderColor = on ? SCOLOR[b.dataset.s] : '';
  });
}
$('status').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  status = b.dataset.s; drawStatus();
});

function growMemo(){
  const el = $('f-memo');
  const cs = getComputedStyle(el);
  const border = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + border) + 'px';
}
$('f-memo').addEventListener('input', e => {
  const m = e.target.value.match(/^\s*[\[［]([^\]］]{1,8})[\]］]\s*/);
  if (m) { cat = m[1].trim(); e.target.value = e.target.value.slice(m[0].length); drawChips(); }
  growMemo();
});

const numOnly = v => v.replace(/[^0-9]/g,'');
$('f-stake').addEventListener('input', e => {
  e.target.value = numOnly(e.target.value);
  const o = Number($('f-odds').value);
  if (o) $('f-payout').value = Math.round(Number(e.target.value||0) * o);
  drawCalc();
});
$('f-odds').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9.]/g,'');
  const s = Number($('f-stake').value);
  if (s) $('f-payout').value = Math.round(s * Number(e.target.value||0));
  drawCalc();
});
$('f-payout').addEventListener('input', e => {
  e.target.value = numOnly(e.target.value);
  const s = Number($('f-stake').value);
  if (s > 0) $('f-odds').value = (Number(e.target.value||0)/s).toFixed(2);
  drawCalc();
});
function drawCalc(){
  const s = Number($('f-stake').value), p = Number($('f-payout').value);
  $('calc').textContent = (s && p) ? `적중 시 ${signed(p-s)}원 · 미적중 시 −${won(s)}원` : '';
}

$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.add === 'clear') { $('f-stake').value = ''; $('f-payout').value = ''; }
  else $('f-stake').value = Number($('f-stake').value||0) + Number(b.dataset.add);
  $('f-stake').dispatchEvent(new Event('input'));
});

$('form').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target === $('f-memo') && e.shiftKey) return;
  e.preventDefault(); save();
});
$('save').addEventListener('click', save);
$('cancel').addEventListener('click', () => resetForm());

async function save(){
  if (busy) return;
  const stake = Number($('f-stake').value);
  if (!stake || stake <= 0) { $('f-stake').focus(); return; }
  const odds = Number($('f-odds').value) || 0;
  const payout = Number($('f-payout').value) || Math.round(stake * odds);
  const rec = {
    date: $('f-date').value || today(), cat: cat || '기타', tags, memo: $('f-memo').value.trim(),
    stake, odds, expect: payout, payout: status === 'hit' ? payout : 0, status
  };
  const wasEdit = !!editId;
  busy = true; $('save').disabled = true;
  const { error } = editId
    ? await supa.from('bets').update(rec).eq('id', editId)
    : await supa.from('bets').insert(rec);
  busy = false; $('save').disabled = false;
  if (error) { toast('저장 실패: ' + error.message); return; }
  resetForm();
  await reload();
  if (!wasEdit) $('f-memo').focus();
}

let modalScrollY = 0;
function openModal(){
  modalScrollY = window.scrollY;
  $('form-card').classList.add('as-modal');
  $('modal-backdrop').classList.remove('hidden');
  $('modal-backdrop').classList.add('show');
  document.body.style.position = 'fixed';
  document.body.style.top = `-${modalScrollY}px`;
  document.body.style.width = '100%';
}
function closeModal(){
  $('form-card').classList.remove('as-modal');
  $('modal-backdrop').classList.remove('show');
  $('modal-backdrop').classList.add('hidden');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  window.scrollTo(0, modalScrollY);
}
$('modal-backdrop').addEventListener('click', () => resetForm());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('form-card').classList.contains('as-modal')) resetForm();
});

function resetForm(){
  editId = null; status = 'pending'; tags = [];
  $('f-memo').value = ''; $('f-stake').value = ''; $('f-odds').value = ''; $('f-payout').value = '';
  $('form-title').textContent = '빠른 입력'; $('form-hint').textContent = 'Enter로 저장';
  $('save').textContent = '기록 추가'; $('cancel').classList.add('hidden');
  drawStatus(); drawCalc(); drawChips(); growMemo();
  closeModal();
}

function edit(id){
  const b = bets.find(x => x.id === id); if(!b) return;
  editId = id; cat = b.cat; tags = Array.isArray(b.tags) ? [...b.tags] : []; status = b.status;
  $('f-date').value = b.date; $('f-memo').value = b.memo || '';
  $('f-stake').value = b.stake; $('f-odds').value = b.odds || '';
  $('f-payout').value = b.payout || b.expect || '';
  $('form-title').textContent = '기록 수정'; $('form-hint').textContent = '수정 중';
  $('save').textContent = '수정 저장'; $('cancel').classList.remove('hidden');
  drawChips(); drawStatus(); drawCalc(); growMemo();
  openModal();
}

/* ---------------- 목록 조작 ---------------- */
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) {
    const item = e.target.closest('.row-item.has-tags');
    if (item) item.querySelector('.row-tags').classList.toggle('hidden');
    return;
  }
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'edit') return edit(id);
  if (busy) return;
  busy = true;
  let error;
  if (act === 'del') {
    if (!confirm('이 기록을 삭제할까요?')) { busy = false; return; }
    ({ error } = await supa.from('bets').delete().eq('id', id));
  } else {
    const x = bets.find(v => v.id === id);
    ({ error } = await supa.from('bets').update({
      status: act, payout: act === 'hit' ? (x.expect || Math.round(x.stake * x.odds)) : 0
    }).eq('id', id));
  }
  busy = false;
  if (error) { toast('처리 실패: ' + error.message); return; }
  await reload();
});

/* ---------------- 렌더 ---------------- */
function currentStreak(){
  const done = bets.filter(b => b.status !== 'pending');
  if (!done.length) return null;
  const first = done[0].status;
  let n = 0;
  for (const b of done) { if (b.status === first) n++; else break; }
  return { status: first, n };
}

function sortView(list){
  const arr = [...list];
  if (sortBy === 'date-asc') arr.sort((a,b) => a.date.localeCompare(b.date) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
  else if (sortBy === 'stake-desc') arr.sort((a,b) => b.stake - a.stake);
  else if (sortBy === 'profit-desc') arr.sort((a,b) => profitOf(b) - profitOf(a));
  return arr;
}

function render(){
  const q = search.toLowerCase();
  const view = bets.filter(b => (!from || b.date >= from) && (!to || b.date <= to))
    .filter(b => !tagFilter.length || tagFilter.some(t => b.cat === t || (b.tags||[]).includes(t)))
    .filter(b => !q || (b.memo||'').toLowerCase().includes(q) || (b.cat||'').toLowerCase().includes(q) || (b.tags||[]).some(t => t.toLowerCase().includes(q)));
  $('listcount').textContent = view.length + '건';

  const done = view.filter(b => b.status !== 'pending');
  const hit = done.filter(b => b.status === 'hit').length;
  const staked = done.reduce((a,b) => a + b.stake, 0);
  const profit = done.reduce((a,b) => a + profitOf(b), 0);
  const rate = done.length ? hit/done.length*100 : 0;
  const roi = staked ? profit/staked*100 : 0;
  const pending = view.length - done.length;
  const streak = currentStreak();

  const t = $('total');
  t.innerHTML = signed(profit) + '<small>원</small>';
  t.style.color = pnl(profit);
  $('meta').innerHTML =
    `<span>적중률 <b class="num">${rate.toFixed(1)}%</b> <span class="num">(${hit}/${done.length})</span></span>` +
    `<span>수익률 <b class="num" style="color:${pnl(profit)}">${roi>0?'+':''}${roi.toFixed(1)}%</b></span>` +
    `<span>배팅액 <b class="num">${won(staked)}</b></span>` +
    (pending ? `<span style="color:var(--wait)">대기 ${pending}건</span>` : '') +
    (streak ? `<span>현재 <b style="color:${streak.status==='hit'?'var(--up)':'var(--down)'}">${streak.n}연${streak.status==='hit'?'승':'패'}</b></span>` : '');

  drawChart(view, profit);
  drawCats(view);
  drawList(sortView(view));
  drawChips();
  drawTagFilter();
}

function drawChart(view, profit){
  const byDay = {};
  view.filter(b => b.status !== 'pending').forEach(b => { byDay[b.date] = (byDay[b.date]||0) + profitOf(b); });
  const keys = Object.keys(byDay).sort();
  if (keys.length < 2) {
    $('chart').innerHTML = '<div class="blank">정산된 기록이 이틀 이상 쌓이면 누적 곡선이 그려집니다</div>';
    return;
  }
  let acc = 0;
  const pts = keys.map(d => { acc += byDay[d]; return { d, v: acc }; });
  const W = 600, H = 112, PAD = 8;
  const vs = pts.map(p => p.v).concat([0]);
  const min = Math.min(...vs), max = Math.max(...vs), span = (max-min) || 1;
  const x = i => PAD + i * (W - PAD*2) / (pts.length - 1);
  const y = v => H - PAD - (v - min) / span * (H - PAD*2);
  const line = pts.map((p,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const zero = y(0), col = profit >= 0 ? '#3fbf7f' : '#e0605f';
  $('chart').innerHTML = `
    <div class="chart-inner" id="chartInner">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="누적 수익 곡선" id="chartSvg">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
          <stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
        <line x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}" stroke="#29323d"
              stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 4"/>
        <path d="${line} L ${x(pts.length-1).toFixed(1)} ${zero.toFixed(1)} L ${x(0).toFixed(1)} ${zero.toFixed(1)} Z" fill="url(#g)"/>
        <path d="${line}" fill="none" stroke="${col}" stroke-width="1.75" vector-effect="non-scaling-stroke"
              stroke-linejoin="round" stroke-linecap="round"/>
        <line id="chartGuide" x1="0" y1="0" x2="0" y2="${H}" stroke="var(--line-2)" stroke-width="1"
              vector-effect="non-scaling-stroke" opacity="0"/>
        <circle id="chartDot" r="3.5" fill="${col}" stroke="var(--panel)" stroke-width="1.5" opacity="0"/>
      </svg>
      <div class="chart-tip hidden" id="chartTip"></div>
    </div>
    <div class="xlab"><span class="num">${pts[0].d.slice(5).replace('-','/')}</span>
      <span class="num" style="color:${pnl(acc)}">누적 ${signed(acc)}</span>
      <span class="num">${pts[pts.length-1].d.slice(5).replace('-','/')}</span></div>`;

  const svg = $('chartSvg'), guide = $('chartGuide'), dot = $('chartDot'), tip = $('chartTip');
  function pick(clientX){
    const rect = svg.getBoundingClientRect();
    const relX = (clientX - rect.left) / rect.width * W;
    let idx = 0, best = Infinity;
    pts.forEach((p,i) => { const d = Math.abs(x(i) - relX); if (d < best) { best = d; idx = i; } });
    return idx;
  }
  function showTip(idx){
    const p = pts[idx];
    guide.setAttribute('x1', x(idx)); guide.setAttribute('x2', x(idx)); guide.setAttribute('opacity', 1);
    dot.setAttribute('cx', x(idx)); dot.setAttribute('cy', y(p.v)); dot.setAttribute('opacity', 1);
    tip.innerHTML = `<b class="num" style="color:${pnl(p.v)}">${signed(p.v)}</b><span class="num">${p.d.slice(5).replace('-','/')}</span>`;
    tip.classList.remove('hidden');
    const rect = svg.getBoundingClientRect();
    const px = rect.width * (x(idx) / W);
    const py = rect.height * (y(p.v) / H);
    const tw = tip.offsetWidth || 70;
    const left = Math.min(Math.max(px, tw / 2 + 4), rect.width - tw / 2 - 4);
    tip.style.left = left + 'px';
    tip.style.top = Math.max(py - 12, 4) + 'px';
  }
  function hideTip(){
    guide.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.classList.add('hidden');
  }
  svg.addEventListener('mousemove', e => showTip(pick(e.clientX)));
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('touchstart', e => { if (e.touches[0]) showTip(pick(e.touches[0].clientX)); }, { passive:true });
  svg.addEventListener('touchmove', e => { if (e.touches[0]) showTip(pick(e.touches[0].clientX)); }, { passive:true });
  svg.addEventListener('touchend', hideTip);
}

function drawCats(view){
  const m = {};
  view.forEach(b => {
    const k = b.cat || '기타';
    m[k] = m[k] || { cat:k, n:0, hit:0, done:0, staked:0, profit:0 };
    m[k].n++;
    if (b.status !== 'pending') {
      m[k].done++; m[k].staked += b.stake; m[k].profit += profitOf(b);
      if (b.status === 'hit') m[k].hit++;
    }
  });
  const list = Object.values(m).sort((a,b) => b.n - a.n);
  if (!list.length) { $('cats').innerHTML = '<div class="blank" style="padding:28px 20px">기록이 없습니다</div>'; return; }
  const maxS = Math.max(1, ...list.map(c => c.staked));
  $('cats').innerHTML = list.map(c => `
    <div class="cat">
      <div class="cat-r">
        <span class="cat-n" style="color:${catColor(c.cat)}">${esc(c.cat)}</span>
        <span class="num" style="font-weight:600;color:${pnl(c.profit)}">${signed(c.profit)}</span>
      </div>
      <div class="cat-s num">${c.n}건 · 적중 ${c.done ? Math.round(c.hit/c.done*100) : 0}% · 수익률 ${c.staked ? (c.profit/c.staked*100).toFixed(1) : '0.0'}%</div>
      <div class="bar"><i style="width:${(c.staked/maxS*100).toFixed(1)}%;background:${catColor(c.cat)};opacity:.55"></i></div>
    </div>`).join('');
}

const PENCIL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const TRASH  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

function rowHtml(b, showDate){
  const p = profitOf(b);
  const right = b.status === 'pending'
    ? `<span class="settle"><button class="hit" data-act="hit" data-id="${b.id}">적중</button><button class="miss" data-act="miss" data-id="${b.id}">미적중</button></span>`
    : `<span class="r num" style="color:${pnl(p)};font-weight:600">${signed(p)}</span>`;
  const extraTags = (b.tags || []).filter(t => t !== b.cat);
  const moreBadge = extraTags.length ? `<span class="tag-more">+${extraTags.length}</span>` : '';
  const tagBadges = extraTags
    .map(t => `<span class="tag sub-tag" style="color:${catColor(t)};background:${tint(catColor(t),.13)}">${esc(t)}</span>`).join('');
  const dateBadge = showDate ? `<i class="num" style="color:var(--dimmer);margin-right:7px;font-style:normal">${b.date.slice(5).replace('-','/')}</i>` : '';
  return `<div class="row-item${extraTags.length ? ' has-tags' : ''}">
    <div class="row">
      <span><span class="tag" style="color:${catColor(b.cat)};background:${tint(catColor(b.cat),.13)}">${esc(b.cat)}</span>${moreBadge}</span>
      <span class="memo">${dateBadge}${b.memo ? esc(b.memo) : '<span style="color:var(--dimmer)">메모 없음</span>'}${b.odds ? `<i class="num">${Number(b.odds).toFixed(2)}배</i>` : ''}</span>
      <span class="r sub num hide-sm">${won(b.stake)}</span>
      <span class="r sub num hide-sm">${b.status === 'pending' ? '—' : won(b.payout)}</span>
      ${right}
      <span class="act hide-sm">
        <button class="icon" data-act="edit" data-id="${b.id}" title="수정">${PENCIL}</button>
        <button class="icon" data-act="del" data-id="${b.id}" title="삭제">${TRASH}</button>
      </span>
    </div>
    ${extraTags.length ? `<div class="row-tags hidden">${tagBadges}</div>` : ''}
  </div>`;
}

function drawList(view){
  if (!view.length) {
    $('list').innerHTML = `<div class="blank">이 기간에는 기록이 없습니다.<br>위에서 첫 기록을 추가해 보세요.<br>
      <span style="font-size:12.5px">메모에 <code>[LOL] 젠지 2세트 승</code> 형태로 붙여넣으면 종목이 자동으로 분류됩니다.</span></div>`;
    return;
  }
  if (sortBy === 'stake-desc' || sortBy === 'profit-desc') {
    $('list').innerHTML = view.map(b => rowHtml(b, true)).join('');
    return;
  }
  const days = [];
  view.forEach(b => {
    const last = days[days.length-1];
    if (last && last.date === b.date) last.rows.push(b); else days.push({ date:b.date, rows:[b] });
  });
  $('list').innerHTML = days.map(g => {
    const dp = g.rows.reduce((a,b) => a + profitOf(b), 0);
    const rows = g.rows.map(b => rowHtml(b, false)).join('');
    return `<div><div class="day"><span class="d num">${g.date}</span>
      <span class="num" style="color:${pnl(dp)};font-weight:600">${signed(dp)}
      <span style="color:var(--dimmer);font-weight:400">· ${g.rows.length}건</span></span></div>${rows}</div>`;
  }).join('');
}

/* ---------------- 백업 ---------------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('btn-export').addEventListener('click', () =>
  download(`토계부_${today()}.json`, JSON.stringify(bets, null, 2), 'application/json'));

$('btn-csv').addEventListener('click', () => {
  const view = bets.filter(b => (!from || b.date >= from) && (!to || b.date <= to));
  const head = '날짜,종목,메모,배팅금액,배당,당첨금액,상태,수익';
  const body = view.map(b => [b.date, b.cat, '"' + String(b.memo||'').replace(/"/g,'""') + '"',
    b.stake, b.odds || '', b.payout || 0,
    ({hit:'적중',miss:'미적중',pending:'대기'})[b.status], profitOf(b)].join(',')).join('\n');
  download(`토계부_${from || '전체'}_${to || ''}.csv`, '\uFEFF' + head + '\n' + body, 'text/csv;charset=utf-8');
});

$('btn-import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) return toast('토계부 백업 파일이 아닙니다.');
      const rows = data.map(d => ({
        date: d.date, cat: d.cat || '기타', tags: Array.isArray(d.tags) ? d.tags : [], memo: d.memo || '',
        stake: Number(d.stake) || 0, odds: Number(d.odds) || 0,
        expect: Number(d.expect) || 0, payout: Number(d.payout) || 0,
        status: ['hit','miss','pending'].includes(d.status) ? d.status : 'pending'
      })).filter(d => d.date && d.stake > 0);
      if (!rows.length) return toast('옮길 기록이 없습니다.');
      const CHUNK = 300;
      let done = 0;
      for (let i = 0; i < rows.length; i += CHUNK) {
        const { error } = await supa.from('bets').insert(rows.slice(i, i + CHUNK));
        if (error) {
          toast(`${done}건 불러온 뒤 실패: ` + error.message);
          await reload();
          return;
        }
        done += Math.min(CHUNK, rows.length - i);
      }
      toast(done + '건을 불러왔습니다.');
      await reload();
    } catch(err) { toast('파일을 읽지 못했습니다.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});
</script>
