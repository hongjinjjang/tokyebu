<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>토계부</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

:root {
  --ink:#11151b; --panel:#171d25; --panel-2:#1d242e; --line:#29323d; --line-2:#364251;
  --text:#e6eaef; --dim:#8d98a7; --dimmer:#5f6b7a;
  --up:#3fbf7f; --down:#e0605f; --wait:#d6a44c; --key:#6478ff;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic', sans-serif;
  background: var(--ink); color: var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing: antialiased; min-height:100vh;
}
.num { font-variant-numeric: tabular-nums; letter-spacing:-.01em; }
.wrap { max-width:1180px; margin:0 auto; padding:0 20px 72px; }

/* 헤더 */
.top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0 24px; }
.brand { display:flex; align-items:baseline; gap:10px; }
.brand b { font-size:19px; font-weight:700; letter-spacing:-.03em; }
.brand span { font-size:12px; color:var(--dimmer); }
.tools { display:flex; gap:6px; flex-wrap:wrap; }

button { font:inherit; cursor:pointer; border-radius:7px; transition:background .12s, border-color .12s, color .12s; }
button:focus-visible { outline:2px solid var(--key); outline-offset:2px; }
.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 11px; font-size:12.5px; }
.ghost:hover { border-color:var(--line-2); color:var(--text); }

/* 저장 경고 */
.warn { display:none; border:1px solid #4a3a24; background:#241d12; color:#e5c185;
        border-radius:9px; padding:10px 13px; font-size:12.5px; margin-bottom:16px; }
.warn.on { display:block; }

/* 기간 */
.range { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:18px; }
.seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; }
.seg button { border:0; background:transparent; color:var(--dim); padding:6px 14px; font-size:13px; border-radius:6px; font-weight:500; }
.seg button.on { background:var(--panel-2); color:var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
input[type=date], .in {
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 10px; font:inherit; font-size:13px; color-scheme:dark;
}
input:focus { outline:none; border-color:var(--key); }

/* 히어로 */
.hero { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:28px; align-items:center;
        background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px 26px; margin-bottom:22px; }
.total { font-size:44px; font-weight:700; letter-spacing:-.045em; line-height:1.05; }
.total small { font-size:20px; font-weight:600; margin-left:3px; }
.total-label { font-size:12.5px; color:var(--dimmer); margin-bottom:6px; }
.meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:13px; color:var(--dim); }
.meta b { color:var(--text); font-weight:600; }
.chart { height:132px; min-width:0; position:relative; }
.chart svg { display:block; width:100%; height:112px; }
.chart .xlab { display:flex; justify-content:space-between; font-size:11px; color:var(--dimmer); margin-top:4px; }
.chart .blank { height:132px; display:flex; align-items:center; justify-content:center; color:var(--dimmer);
                font-size:13px; border:1px dashed var(--line); border-radius:10px; text-align:center; padding:0 12px; }

/* 그리드 */
.grid { display:grid; grid-template-columns:352px 1fr; gap:22px; align-items:start; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.card + .card { margin-top:22px; }
.card-h { display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); }
.card-h h2 { margin:0; font-size:14px; font-weight:600; letter-spacing:-.02em; }
.card-h em { font-style:normal; font-size:12px; color:var(--dimmer); }
.card-b { padding:16px 18px; }

/* 폼 */
.f { display:block; margin-bottom:13px; }
.f > span { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
.fin { width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
       border-radius:8px; padding:9px 11px; font:inherit; font-size:14px; color-scheme:dark; }
.fin:focus { outline:none; border-color:var(--key); }
.fin::placeholder { color:var(--dimmer); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { border:1px solid var(--line); background:transparent; color:var(--dim); padding:5px 10px; font-size:12.5px; border-radius:20px; }
.chip:hover { border-color:var(--line-2); }
.quick { display:flex; gap:5px; margin-top:7px; }
.quick button { flex:1; border:1px solid var(--line); background:transparent; color:var(--dim); font-size:12px; padding:5px 0; }
.quick button:hover { color:var(--text); border-color:var(--line-2); }
.calc { font-size:12px; color:var(--dimmer); margin-top:6px; min-height:17px; }
.status { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.status button { border:1px solid var(--line); background:transparent; color:var(--dim); padding:8px 0; font-size:13px; font-weight:500; }
.submit { width:100%; border:0; background:var(--key); color:#fff; padding:11px 0; font-size:14px; font-weight:600; margin-top:4px; }
.submit:hover { background:#7386ff; }
.cancel { width:100%; border:0; background:transparent; color:var(--dim); padding:8px 0; font-size:12.5px; margin-top:4px; display:none; }
.cancel.on { display:block; }

/* 종목별 */
.cat { padding:11px 18px; border-bottom:1px solid var(--line); }
.cat:last-child { border-bottom:0; }
.cat-r { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.cat-n { font-size:13.5px; font-weight:600; }
.cat-s { font-size:12px; color:var(--dimmer); margin-top:3px; }
.bar { height:3px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:2px; }

/* 목록 */
.day { padding:9px 18px; background:var(--panel-2); border-bottom:1px solid var(--line); border-top:1px solid var(--line);
       display:flex; justify-content:space-between; font-size:12.5px; }
.day span.d { color:var(--dim); }
.row { display:grid; grid-template-columns:68px 1fr 92px 92px 104px 62px; align-items:center; gap:10px;
       padding:11px 18px; border-bottom:1px solid var(--line); font-size:13.5px; }
.row:last-child { border-bottom:0; }
.row:hover { background:rgba(255,255,255,.018); }
.tag { display:inline-block; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:5px; white-space:nowrap; }
.memo { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.memo i { font-style:normal; color:var(--dimmer); font-size:12px; margin-left:7px; }
.r { text-align:right; }
.sub { color:var(--dim); }
.act { display:flex; gap:4px; justify-content:flex-end; opacity:0; }
.row:hover .act, .row:focus-within .act { opacity:1; }
.icon { border:0; background:transparent; color:var(--dimmer); padding:4px; line-height:0; border-radius:5px; }
.icon:hover { color:var(--text); background:var(--panel-2); }
.settle { display:flex; gap:5px; justify-content:flex-end; }
.settle button { border:1px solid var(--line); background:transparent; padding:4px 9px; font-size:12px; }
.settle button.hit { color:var(--up); }
.settle button.miss { color:var(--down); }
.settle button:hover { border-color:currentColor; }
.blank { padding:56px 20px; text-align:center; color:var(--dimmer); font-size:13.5px; line-height:1.9; }
.blank code { background:var(--panel-2); padding:2px 6px; border-radius:4px; color:var(--dim); }

@media (max-width: 980px) {
  .grid { grid-template-columns:1fr; }
  .hero { grid-template-columns:1fr; gap:16px; }
}
@media (max-width: 620px) {
  .wrap { padding:0 12px 60px; }
  .row { grid-template-columns:58px 1fr 100px; }
  .hide-sm { display:none; }
  .total { font-size:36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand"><b>토계부</b><span id="count">0건 기록됨</span></div>
    <div class="tools">
      <button class="ghost" id="btn-csv">CSV 내려받기</button>
      <button class="ghost" id="btn-export">백업</button>
      <button class="ghost" id="btn-import">복원</button>
      <input type="file" id="file" accept="application/json" style="display:none" />
    </div>
  </header>

  <div class="warn" id="warn">
    이 브라우저에서는 자동 저장이 막혀 있어 창을 닫으면 기록이 사라집니다. 백업 버튼으로 파일을 내려받아 두세요.
  </div>

  <div class="range">
    <div class="seg" id="seg">
      <button data-p="all">전체</button>
      <button data-p="today">오늘</button>
      <button data-p="month" class="on">이번 달</button>
      <button data-p="last">지난달</button>
    </div>
    <input type="date" id="from" />
    <span style="color:var(--dimmer)">–</span>
    <input type="date" id="to" />
  </div>

  <section class="hero">
    <div>
      <div class="total-label">기간 수익</div>
      <div class="total num" id="total">0<small>원</small></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <div class="grid">
    <div>
      <!-- 입력 -->
      <div class="card">
        <div class="card-h"><h2 id="form-title">빠른 입력</h2><em id="form-hint">Enter로 저장</em></div>
        <div class="card-b" id="form">
          <label class="f"><span>일자</span><input class="fin" type="date" id="f-date" /></label>

          <div class="f"><span>종목</span><div class="chips" id="chips"></div></div>

          <label class="f"><span>메모</span>
            <input class="fin" id="f-memo" placeholder="젠지 2세트 승" autocomplete="off" />
          </label>

          <div class="two">
            <label class="f"><span>배팅금액</span>
              <input class="fin num" id="f-stake" inputmode="numeric" placeholder="0" autocomplete="off" />
            </label>
            <label class="f"><span>배당</span>
              <input class="fin num" id="f-odds" inputmode="decimal" placeholder="1.85" autocomplete="off" />
            </label>
          </div>

          <div class="quick">
            <button data-add="10000">+1만</button>
            <button data-add="50000">+5만</button>
            <button data-add="100000">+10만</button>
            <button data-add="clear">지우기</button>
          </div>

          <label class="f" style="margin-top:13px"><span>당첨금액</span>
            <input class="fin num" id="f-payout" inputmode="numeric" placeholder="배당을 넣으면 자동 계산" autocomplete="off" />
            <div class="calc" id="calc"></div>
          </label>

          <div class="f"><span>결과</span>
            <div class="status" id="status">
              <button data-s="hit">적중</button>
              <button data-s="miss">미적중</button>
              <button data-s="pending" class="on">대기</button>
            </div>
          </div>

          <button class="submit" id="save">기록 추가</button>
          <button class="cancel" id="cancel">수정 취소</button>
        </div>
      </div>

      <!-- 종목별 -->
      <div class="card">
        <div class="card-h"><h2>종목별</h2><em>기간 내</em></div>
        <div id="cats"></div>
      </div>
    </div>

    <!-- 목록 -->
    <div class="card">
      <div class="card-h"><h2>기록</h2><em class="num" id="listcount">0건</em></div>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
/* ---------------- 상수 · 유틸 ---------------- */
const KEY = 'tokyebu:v1';
const BASE_CATS = ['LOL','축구','야구','농구','배구','UFC','기타'];
const CAT_COLOR = { LOL:'#8f7ced', 축구:'#4fb58a', 야구:'#5aa9e0', 농구:'#e0a74f', 배구:'#d96a8e',
                    UFC:'#e0805a', MLB:'#5aa9e0', NBA:'#e0a74f', KBO:'#5aa9e0', 기타:'#8d98a7' };
const catColor = c => CAT_COLOR[c] || '#7d8b9c';
const tint = (hex,a) => { const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

const iso = d => d.toLocaleDateString('sv-SE');
const today = () => iso(new Date());
const won = n => (n||0).toLocaleString('ko-KR');
const signed = n => (n>0?'+':n<0?'−':'') + won(Math.abs(n));
const pnl = n => n>0?'var(--up)':n<0?'var(--down)':'var(--dim)';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const profitOf = b => b.status==='hit' ? (b.payout||0)-b.stake : b.status==='miss' ? -b.stake : 0;
function monthRange(off){ const n=new Date();
  return [iso(new Date(n.getFullYear(), n.getMonth()+off, 1)), iso(new Date(n.getFullYear(), n.getMonth()+off+1, 0))]; }

const $ = id => document.getElementById(id);

/* ---------------- 상태 ---------------- */
let bets = [];
let canSave = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ canSave = false; }
if (!canSave) $('warn').classList.add('on');

try { const raw = localStorage.getItem(KEY); if (raw) bets = JSON.parse(raw) || []; } catch(e) {}

function persist(){ if(!canSave) return; try { localStorage.setItem(KEY, JSON.stringify(bets)); } catch(e){} }

let from = monthRange(0)[0], to = monthRange(0)[1];
let cat = 'LOL', status = 'pending', editId = null;
$('from').value = from; $('to').value = to; $('f-date').value = today();

/* ---------------- 기간 ---------------- */
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('seg').children].forEach(x => x.classList.toggle('on', x === b));
  const p = b.dataset.p;
  if (p==='today') { from = to = today(); }
  else if (p==='month') { [from,to] = monthRange(0); }
  else if (p==='last') { [from,to] = monthRange(-1); }
  else { from = ''; to = ''; }
  $('from').value = from; $('to').value = to;
  render();
});
$('from').addEventListener('change', e => { from = e.target.value; clearSeg(); render(); });
$('to').addEventListener('change', e => { to = e.target.value; clearSeg(); render(); });
function clearSeg(){ [...$('seg').children].forEach(x => x.classList.remove('on')); }

/* ---------------- 폼 ---------------- */
function drawChips(){
  const all = [...new Set([...BASE_CATS, ...bets.map(b=>b.cat)])].filter(Boolean);
  $('chips').innerHTML = all.map(c => {
    const on = c === cat;
    const st = on ? `style="color:${catColor(c)};border-color:${catColor(c)};background:${tint(catColor(c),.12)}"` : '';
    return `<button class="chip" data-c="${esc(c)}" ${st}>${esc(c)}</button>`;
  }).join('');
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  cat = b.dataset.c; drawChips();
});

const SCOLOR = { hit:'var(--up)', miss:'var(--down)', pending:'var(--wait)' };
function drawStatus(){
  [...$('status').children].forEach(b => {
    const on = b.dataset.s === status;
    b.classList.toggle('on', on);
    b.style.color = on ? SCOLOR[b.dataset.s] : '';
    b.style.borderColor = on ? SCOLOR[b.dataset.s] : '';
  });
}
$('status').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  status = b.dataset.s; drawStatus();
});

// 메모에 [LOL] 형태를 붙여넣으면 종목 자동 분류
$('f-memo').addEventListener('input', e => {
  const m = e.target.value.match(/^\s*[\[［]([^\]］]{1,8})[\]］]\s*/);
  if (m) { cat = m[1].trim(); e.target.value = e.target.value.slice(m[0].length); drawChips(); }
});

const numOnly = v => v.replace(/[^0-9]/g,'');
$('f-stake').addEventListener('input', e => {
  e.target.value = numOnly(e.target.value);
  const o = Number($('f-odds').value);
  if (o) $('f-payout').value = Math.round(Number(e.target.value||0) * o);
  drawCalc();
});
$('f-odds').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9.]/g,'');
  const s = Number($('f-stake').value);
  if (s) $('f-payout').value = Math.round(s * Number(e.target.value||0));
  drawCalc();
});
$('f-payout').addEventListener('input', e => {
  e.target.value = numOnly(e.target.value);
  const s = Number($('f-stake').value);
  if (s > 0) $('f-odds').value = (Number(e.target.value||0)/s).toFixed(2);
  drawCalc();
});
function drawCalc(){
  const s = Number($('f-stake').value), p = Number($('f-payout').value);
  $('calc').textContent = (s && p) ? `적중 시 ${signed(p-s)}원 · 미적중 시 −${won(s)}원` : '';
}

document.querySelector('.quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.add === 'clear') { $('f-stake').value = ''; $('f-payout').value = ''; }
  else $('f-stake').value = Number($('f-stake').value||0) + Number(b.dataset.add);
  $('f-stake').dispatchEvent(new Event('input'));
});

$('form').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
$('save').addEventListener('click', save);
$('cancel').addEventListener('click', () => resetForm());

function save(){
  const stake = Number($('f-stake').value);
  if (!stake || stake <= 0) { $('f-stake').focus(); return; }
  const odds = Number($('f-odds').value) || 0;
  const payout = Number($('f-payout').value) || Math.round(stake * odds);
  const rec = {
    date: $('f-date').value || today(), cat: cat || '기타', memo: $('f-memo').value.trim(),
    stake, odds, expect: payout, payout: status === 'hit' ? payout : 0, status
  };
  if (editId) bets = bets.map(b => b.id === editId ? Object.assign({}, b, rec) : b);
  else bets.unshift(Object.assign({ id: uid(), seq: Date.now() }, rec));
  persist(); resetForm(); render(); $('f-memo').focus();
}

function resetForm(){
  editId = null; status = 'pending';
  $('f-memo').value = ''; $('f-stake').value = ''; $('f-odds').value = ''; $('f-payout').value = '';
  $('form-title').textContent = '빠른 입력'; $('form-hint').textContent = 'Enter로 저장';
  $('save').textContent = '기록 추가'; $('cancel').classList.remove('on');
  drawStatus(); drawCalc();
}

function edit(id){
  const b = bets.find(x => x.id === id); if(!b) return;
  editId = id; cat = b.cat; status = b.status;
  $('f-date').value = b.date; $('f-memo').value = b.memo;
  $('f-stake').value = b.stake; $('f-odds').value = b.odds || '';
  $('f-payout').value = b.payout || b.expect || '';
  $('form-title').textContent = '기록 수정'; $('form-hint').textContent = '수정 중';
  $('save').textContent = '수정 저장'; $('cancel').classList.add('on');
  drawChips(); drawStatus(); drawCalc();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---------------- 목록 이벤트 ---------------- */
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'edit') return edit(id);
  if (act === 'del') {
    if (!confirm('이 기록을 삭제할까요?')) return;
    bets = bets.filter(x => x.id !== id);
  } else {
    bets = bets.map(x => x.id !== id ? x : Object.assign({}, x, {
      status: act, payout: act === 'hit' ? (x.expect || Math.round(x.stake * x.odds)) : 0
    }));
  }
  persist(); render();
});

/* ---------------- 렌더 ---------------- */
function render(){
  const view = bets
    .filter(b => (!from || b.date >= from) && (!to || b.date <= to))
    .sort((a,b) => a.date === b.date ? b.seq - a.seq : (a.date < b.date ? 1 : -1));

  $('count').textContent = bets.length + '건 기록됨';
  $('listcount').textContent = view.length + '건';

  /* 요약 */
  const done = view.filter(b => b.status !== 'pending');
  const hit = done.filter(b => b.status === 'hit').length;
  const staked = done.reduce((a,b) => a + b.stake, 0);
  const profit = done.reduce((a,b) => a + profitOf(b), 0);
  const rate = done.length ? hit/done.length*100 : 0;
  const roi = staked ? profit/staked*100 : 0;
  const pending = view.length - done.length;

  const t = $('total');
  t.innerHTML = signed(profit) + '<small>원</small>';
  t.style.color = pnl(profit);
  $('meta').innerHTML =
    `<span>적중률 <b class="num">${rate.toFixed(1)}%</b> <span class="num">(${hit}/${done.length})</span></span>` +
    `<span>수익률 <b class="num" style="color:${pnl(profit)}">${roi>0?'+':''}${roi.toFixed(1)}%</b></span>` +
    `<span>배팅액 <b class="num">${won(staked)}</b></span>` +
    (pending ? `<span style="color:var(--wait)">대기 ${pending}건</span>` : '');

  drawChart(view, profit);
  drawCats(view);
  drawList(view);
  drawChips(); drawStatus();
}

/* 누적 수익 곡선 (직접 그리기) */
function drawChart(view, profit){
  const byDay = {};
  view.filter(b => b.status !== 'pending').forEach(b => { byDay[b.date] = (byDay[b.date]||0) + profitOf(b); });
  const keys = Object.keys(byDay).sort();
  if (keys.length < 2) {
    $('chart').innerHTML = '<div class="blank">정산된 기록이 이틀 이상 쌓이면 누적 곡선이 그려집니다</div>';
    return;
  }
  let acc = 0;
  const pts = keys.map(d => { acc += byDay[d]; return { d, v: acc }; });
  const W = 600, H = 112, PAD = 8;
  const vs = pts.map(p => p.v).concat([0]);
  const min = Math.min(...vs), max = Math.max(...vs);
  const span = (max - min) || 1;
  const x = i => PAD + i * (W - PAD*2) / (pts.length - 1);
  const y = v => H - PAD - (v - min) / span * (H - PAD*2);
  const line = pts.map((p,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const zero = y(0);
  const col = profit >= 0 ? '#3fbf7f' : '#e0605f';
  $('chart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="누적 수익 곡선">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}"
            stroke="#29323d" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 4"/>
      <path d="${line} L ${x(pts.length-1).toFixed(1)} ${zero.toFixed(1)} L ${x(0).toFixed(1)} ${zero.toFixed(1)} Z" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="1.75"
            vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="xlab"><span class="num">${pts[0].d.slice(5).replace('-','/')}</span>
      <span class="num" style="color:${pnl(acc)}">누적 ${signed(acc)}</span>
      <span class="num">${pts[pts.length-1].d.slice(5).replace('-','/')}</span></div>`;
}

function drawCats(view){
  const m = {};
  view.forEach(b => {
    const k = b.cat || '기타';
    m[k] = m[k] || { cat:k, n:0, hit:0, done:0, staked:0, profit:0 };
    m[k].n++;
    if (b.status !== 'pending') {
      m[k].done++; m[k].staked += b.stake; m[k].profit += profitOf(b);
      if (b.status === 'hit') m[k].hit++;
    }
  });
  const list = Object.values(m).sort((a,b) => b.n - a.n);
  if (!list.length) { $('cats').innerHTML = '<div class="blank" style="padding:28px 20px">기록이 없습니다</div>'; return; }
  const maxS = Math.max(1, ...list.map(c => c.staked));
  $('cats').innerHTML = list.map(c => `
    <div class="cat">
      <div class="cat-r">
        <span class="cat-n" style="color:${catColor(c.cat)}">${esc(c.cat)}</span>
        <span class="num" style="font-weight:600;color:${pnl(c.profit)}">${signed(c.profit)}</span>
      </div>
      <div class="cat-s num">${c.n}건 · 적중 ${c.done ? Math.round(c.hit/c.done*100) : 0}% · 수익률 ${c.staked ? (c.profit/c.staked*100).toFixed(1) : '0.0'}%</div>
      <div class="bar"><i style="width:${(c.staked/maxS*100).toFixed(1)}%;background:${catColor(c.cat)};opacity:.55"></i></div>
    </div>`).join('');
}

const PENCIL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const TRASH  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

function drawList(view){
  if (!view.length) {
    $('list').innerHTML = `<div class="blank">이 기간에는 기록이 없습니다.<br>왼쪽에서 첫 기록을 추가해 보세요.<br>
      <span style="font-size:12.5px">메모에 <code>[LOL] 젠지 2세트 승</code> 형태로 붙여넣으면 종목이 자동으로 분류됩니다.</span></div>`;
    return;
  }
  const days = [];
  view.forEach(b => {
    const last = days[days.length-1];
    if (last && last.date === b.date) last.rows.push(b); else days.push({ date:b.date, rows:[b] });
  });
  $('list').innerHTML = days.map(g => {
    const dp = g.rows.reduce((a,b) => a + profitOf(b), 0);
    const rows = g.rows.map(b => {
      const p = profitOf(b);
      const right = b.status === 'pending'
        ? `<span class="settle"><button class="hit" data-act="hit" data-id="${b.id}">적중</button><button class="miss" data-act="miss" data-id="${b.id}">미적중</button></span>`
        : `<span class="r num" style="color:${pnl(p)};font-weight:600">${signed(p)}</span>`;
      return `<div class="row">
        <span><span class="tag" style="color:${catColor(b.cat)};background:${tint(catColor(b.cat),.13)}">${esc(b.cat)}</span></span>
        <span class="memo">${b.memo ? esc(b.memo) : '<span style="color:var(--dimmer)">메모 없음</span>'}${b.odds ? `<i class="num">${Number(b.odds).toFixed(2)}배</i>` : ''}</span>
        <span class="r sub num hide-sm">${won(b.stake)}</span>
        <span class="r sub num hide-sm">${b.status === 'pending' ? '—' : won(b.payout)}</span>
        ${right}
        <span class="act hide-sm">
          <button class="icon" data-act="edit" data-id="${b.id}" title="수정">${PENCIL}</button>
          <button class="icon" data-act="del" data-id="${b.id}" title="삭제">${TRASH}</button>
        </span>
      </div>`;
    }).join('');
    return `<div><div class="day"><span class="d num">${g.date}</span>
      <span class="num" style="color:${pnl(dp)};font-weight:600">${signed(dp)}
      <span style="color:var(--dimmer);font-weight:400">· ${g.rows.length}건</span></span></div>${rows}</div>`;
  }).join('');
}

/* ---------------- 백업 ---------------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('btn-export').addEventListener('click', () =>
  download(`토계부_${today()}.json`, JSON.stringify(bets, null, 2), 'application/json'));

$('btn-csv').addEventListener('click', () => {
  const view = bets.filter(b => (!from || b.date >= from) && (!to || b.date <= to))
                   .sort((a,b) => a.date < b.date ? 1 : -1);
  const head = '날짜,종목,메모,배팅금액,배당,당첨금액,상태,수익';
  const body = view.map(b => [b.date, b.cat, '"' + String(b.memo).replace(/"/g,'""') + '"',
    b.stake, b.odds || '', b.payout || 0,
    ({hit:'적중',miss:'미적중',pending:'대기'})[b.status], profitOf(b)].join(',')).join('\n');
  download(`토계부_${from || '전체'}_${to || ''}.csv`, '\uFEFF' + head + '\n' + body, 'text/csv;charset=utf-8');
});

$('btn-import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (Array.isArray(data)) {
        const have = new Set(bets.map(b => b.id));
        bets = data.filter(d => d && d.id && !have.has(d.id)).concat(bets);
        persist(); render();
      } else alert('토계부 백업 파일이 아닙니다.');
    } catch(err) { alert('파일을 읽지 못했습니다. 백업 JSON 파일인지 확인해 주세요.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ---------------- 시작 ---------------- */
resetForm();
render();
$('f-memo').focus();
</script>
</body>
